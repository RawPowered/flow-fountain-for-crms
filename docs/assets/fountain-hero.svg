<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" role="img" aria-labelledby="title desc">
  <title id="title">Flow Fountain for CRMs</title>
  <desc id="desc">A teal and blue illustration linking sources, analyst review, and preservation. This is a project illustration, not a software screenshot.</desc>
